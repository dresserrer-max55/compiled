name: Build Globed Android64 from ZIP (GD 2.2091 nightly SDK)

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '**/*.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build Globed Android64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (contains uploaded ZIP)
        uses: actions/checkout@v6

      - name: Find and extract uploaded source ZIP
        id: source
        shell: bash
        run: |
          set -euo pipefail
          ZIP_PATH="${GLOBED_SOURCE_ZIP:-}"
          if [[ -n "$ZIP_PATH" ]]; then
            [[ -f "$ZIP_PATH" ]] || { echo "GLOBED_SOURCE_ZIP points to a missing file: $ZIP_PATH"; exit 1; }
          else
            mapfile -t ZIPS < <(find . -maxdepth 3 -type f -iname '*.zip' ! -path './.git/*' | sort)
            if [[ ${#ZIPS[@]} -eq 0 ]]; then
              echo 'No source ZIP found. Upload the Globed source ZIP to the repository root, then push/commit it.'
              exit 1
            fi
            if [[ ${#ZIPS[@]} -gt 1 ]]; then
              echo 'More than one ZIP found. Set the repository Actions variable GLOBED_SOURCE_ZIP to the desired relative path, e.g. globed2-main.zip.'
              printf 'Found: %s\n' "${ZIPS[@]}"
              exit 1
            fi
            ZIP_PATH="${ZIPS[0]}"
          fi
          echo "Using source archive: $ZIP_PATH"
          mkdir -p "$RUNNER_TEMP/globed-source"
          unzip -q "$ZIP_PATH" -d "$RUNNER_TEMP/globed-source"
          SOURCE_ROOT="$(find "$RUNNER_TEMP/globed-source" -type f -name CMakeLists.txt -not -path '*/build/*' -print -quit | xargs -r dirname)"
          if [[ -z "$SOURCE_ROOT" || ! -f "$SOURCE_ROOT/mod.json.template" ]]; then
            echo 'Could not find the Globed project root (expected CMakeLists.txt and mod.json.template in the same directory).'
            find "$RUNNER_TEMP/globed-source" -maxdepth 4 -type f | head -80
            exit 1
          fi
          echo "Source root: $SOURCE_ROOT"
          # Replace checked-out files with the source from the ZIP, but preserve the workflow
          # that GitHub needs in the repository to launch this job.
          rsync -a --delete --exclude='.git/' --exclude='.github/workflows/build.yml' "$SOURCE_ROOT/" "$GITHUB_WORKSPACE/"
          echo "root=$GITHUB_WORKSPACE" >> "$GITHUB_OUTPUT"
          echo 'Extracted source archive successfully.'

      - name: Build Android64 package
        uses: geode-sdk/build-geode-mod@main
        env:
          GLOBED_SENTRY_URL: ${{ vars.GLOBED_SENTRY_URL }}
          GLOBED_SENTRY_KEY: ${{ vars.GLOBED_SENTRY_KEY }}
        with:
          # Use Geode's latest development SDK rather than stable 5.11.2 (targeted at GD 2.2081).
          sdk: 'nightly'
          # Explicitly use current bindings, which are being updated for GD 2.2091.
          bindings: 'geode-sdk/bindings'
          bindings-ref: 'main'
          build-config: Release
          configure-args: '-DGLOBED_RELEASE=ON'
          export-symbols: true
          combine: true
          target: Android64

      - name: Combine build artifacts
        uses: geode-sdk/build-geode-mod/combine@main
        with:
          zstd: true
          optimize-pngs: true
        id: combine

      - name: Upload experimental Android64 artifact
        uses: actions/upload-artifact@v6
        with:
          name: globed-android64-gd-2.2091-nightly-experimental
          path: ${{ steps.combine.outputs.build-output }}/*.geode
          if-no-files-found: error
          retention-days: 14
          
