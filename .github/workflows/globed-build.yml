name: Build Globed 2.2091 (Android64)

# Compila Globed (GlobedGD/globed2) para Android64 y GD 2.2091, sin zip: descarga el codigo de GitHub.
# Usa la rama v6 de Geode (adaptada a 2.2091) para el SDK, y compila tambien el loader de esa rama para enlazar el mod.
# No usa cache de CPM a proposito: una cache vieja de asp2 rompia el build ("asp/fs/Path.hpp not found").

on:
  workflow_dispatch:
    inputs:
      mod_repo:
        description: 'Repo del mod (owner/repo)'
        default: 'GlobedGD/globed2'
      mod_ref:
        description: 'Rama, tag o commit del mod (vacio = rama por defecto)'
        default: ''
  push:
    branches:
      - "**"
    paths:
      - '.github/workflows/globed-build.yml'

env:
  GD_VERSION: "2.2091"
  GD_COMP_VERSION: "22091"
  GEODE_REF: "v6"
  BINDINGS_REF: "5326138"
  CPM_SOURCE_CACHE: ${{ github.workspace }}/cpm-cache

jobs:
  build:
    name: Android64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout de Globed
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.mod_repo || 'GlobedGD/globed2' }}
          ref: ${{ inputs.mod_ref || '' }}
          submodules: recursive
          path: globed_src

      - name: Apuntar mod.json a GD 2.2091 y quitar la comprobacion de version de Geode
        shell: bash
        run: |
          cd globed_src
          python3 - <<'PY'
          import os, re, sys
          v = os.environ["GD_VERSION"]
          done = False
          for name in ("mod.json", "mod.json.template"):
              if not os.path.isfile(name):
                  continue
              s = open(name, encoding="utf-8").read()
              def fix(m):
                  body = m.group(2)
                  if body.lstrip().startswith("{"):
                      body = re.sub(r'("android(?:32|64)?"\s*:\s*)"[^"]*"', r'\1"%s"' % v, body)
                  else:
                      body = '"%s"' % v
                  return m.group(1) + body
              n = re.sub(r'("gd"\s*:\s*)(\{[^}]*\}|"[^"]*")', fix, s, count=1)
              open(name, "w", encoding="utf-8").write(n)
              print(name, "->", re.search(r'"gd"\s*:\s*(\{[^}]*\}|"[^"]*")', n).group(1))
              done = True
          if not done:
              sys.exit("No hay mod.json ni mod.json.template en la raiz del repo")
          PY
          # Globed fija asp2 en un commit de agosto (#a2ddce1, ANTES del rework de asp::fs). El SDK v6 necesita el asp2
          # nuevo (asp/fs/Path.hpp), y como CMake usa el primero que se declara, el build rompia. Se quita esa
          # linea para que mande la version del SDK.
          if grep -q 'set(GEODE_ASP_VERSION' CMakeLists.txt; then
            sed -i '/set(GEODE_ASP_VERSION/d' CMakeLists.txt
            echo "Quitada la version fija de asp2 de CMakeLists.txt"
          fi
          if [ -f geobuild.py ] && grep -q 'if not gc.ignore_geode_mismatch:' geobuild.py; then
            sed -i 's/if not gc.ignore_geode_mismatch:/if False:  # parcheado: SDK v6 es mas nuevo que el requerido/' geobuild.py
            grep -n 'parcheado' geobuild.py
          fi

      - name: Parchear fuentes de Globed para Geode v6 / asp 1.5 / arc nuevo
        shell: bash
        run: |
          python3 - globed_src <<'PY'
          import sys, re, glob, os
          root = sys.argv[1]
          def edit(path, fn):
              t = open(path, encoding="utf-8").read(); n = fn(t)
              if n != t:
                  open(path, "w", encoding="utf-8").write(n); print("parcheado", path)

          def single(t):
              return t.replace("auto [p, size] = arc::getTypename<T>();\n    return {p, size};",
                               "return std::string_view(arc::getTypename<T>());")
          edit(f"{root}/include/globed/util/singleton.hpp", single)

          def prelude(t):
              inc = ("#include <asp/iter/std.hpp>\n#include <asp/fs/std.hpp>\n#include <filesystem>\n#include <string>\n#include <concepts>\n"
                     "namespace globed {\n"
                     "inline std::string pathToStr(const char* s) { return s ? s : \"\"; }\n"
                     "inline std::string pathToStr(const std::string& s) { return s; }\n"
                     "inline std::string pathToStr(const std::filesystem::path& p) { return p.string(); }\n"
                     "template <typename P> requires (!std::is_same_v<P, std::filesystem::path> && requires(const P& p) { { p.string() } -> std::convertible_to<std::string>; })\n"
                     "inline std::string pathToStr(const P& p) { return p.string(); }\n"
                     "}\n")
              return t if "asp/iter/std.hpp" in t else t.replace("#pragma once\n", "#pragma once\n\n" + inc, 1)
          edit(f"{root}/include/globed/prelude.hpp", prelude)

          def paths(t):
              key = "pathToString("
              while True:
                  i = t.find(key)
                  if i < 0: return t
                  # retroceder sobre el prefijo de namespace
                  st = i
                  while st > 0 and (t[st-1].isalnum() or t[st-1] in "_:"):
                      st -= 1
                  j = i + len(key); depth = 1
                  while depth:
                      c = t[j]; depth += (c == "(") - (c == ")"); j += 1
                  arg = t[i+len(key):j-1]
                  t = t[:st] + "::globed::pathToStr(" + arg + ")" + t[j:]
          for f in glob.glob(f"{root}/src/**/*.[ch]pp", recursive=True) + glob.glob(f"{root}/include/**/*.hpp", recursive=True):
              edit(f, lambda t: paths(t) if "pathToString(" in t else t)

          # ---------- resto de parches ----------
          def rd(p): return open(f"{root}/{p}", encoding="utf-8").read()
          def sub(p, pairs):
              path = f"{root}/{p}"
              if not os.path.isfile(path):
                  print("NO EXISTE", p); return
              def fn(t):
                  for a, b in pairs:
                      if a not in t: print("  (no encontrado en", p, "):", a[:60])
                      t = t.replace(a, b)
                  return t
              edit(path, fn)

          # gd:: -> std::
          for f in glob.glob(f"{root}/src/**/*.[ch]pp", recursive=True) + glob.glob(f"{root}/include/**/*.hpp", recursive=True):
              edit(f, lambda t: t.replace("gd::string", "std::string").replace("gd::vector", "std::vector"))

          # firma de PlayLayer en 2.2091
          for p in ("src/core/hooks/PlayLayer.cpp", "src/modules/switcheroo/Hooks.cpp"):
              sub(p, [("init(GJGameLevel* level, bool a, bool b)", "init(GJGameLevel* level, bool b)"),
                      ("PlayLayer::init(level, a, b)", "PlayLayer::init(level, b)")])
          for p in ("src/core/actions.cpp", "src/ui/menu/WarpLoadPopup.cpp"):
              sub(p, [("PlayLayer::scene(classify.level, false, false)", "PlayLayer::scene(classify.level, false)"),
                      ("PlayLayer::scene(level, false, false)", "PlayLayer::scene(level, false)")])

          # asp::Duration ya no es un Result
          sub("src/modules/switcheroo/Hooks.cpp", [("*asp::Duration::fromSecs(", "asp::Duration::fromSecs(")])
          sub("src/core/hooks/GJBaseGameLayer.cpp", [("Duration::fromSecsF32(1.f / 30.f).value()", "Duration::fromSecsF32(1.f / 30.f)"),
                                                      ("Duration::fromSecsF32(val).value()", "Duration::fromSecsF32(val)")])

          # iteradores de asp 1.5
          sub("src/core/net/EventEncoder.cpp", [("find([&](auto& el) {", "find([&](auto&& el) {")])
          sub("src/ui/game/ProfilerOverlay.cpp", [("[](auto ref) { return ref.get().second.totalTime", "[](auto&& ref) { return ref.second.totalTime")])
          sub("src/ui/menu/RoomListingPopup.cpp", [("RoomListingCell::create(room.get(), this)", "RoomListingCell::create(room, this)")])
          sub("src/audio/AudioManager.cpp", [("std::string s = asp::iter::from(str).filter([](char c) {\n        return c != '-';\n    }).collect<std::string>();",
                                              "std::string s;\n    for (char c : str) { if (c != '-') s.push_back(c); }")])

          # iterdir -> iterDir
          sub("src/core/EmoteManager.cpp", [
              ("asp::fs::iterdir(Mod::get()->getResourcesDir())", "asp::fs::iterDir(Mod::get()->getResourcesDir())"),
              ("for (auto& entry : *res) {\n            auto name", "for (auto&& entryRes : *res) {\n            if (!entryRes) continue;\n            auto entry = std::move(entryRes).unwrap();\n            auto name"),
              ("entry.path().filename()", "std::filesystem::path(entry.path.string()).filename()"),
              ("em.registerSfx(num, entry.path());", "em.registerSfx(num, std::filesystem::path(entry.path.string()));")])

          sub("src/core/hooks/GJBaseGameLayer.cpp", [("auto& [id, player] = rw.get();", "auto& [id, player] = rw;")])
          sub("src/core/preload/PreloadManager.cpp", [
              ("return item.get().iconType", "return item.iconType"),
              ("asp::fs::equivalent(fspath, highGraphicsFolder).unwrapOr(false)", "asp::fs::Path(fspath.string()).equivalent(asp::fs::Path(highGraphicsFolder))"),
              ("!asp::fs::equivalent(fspath, textureLdrUnzipped).unwrapOr(false)", "!asp::fs::Path(fspath.string()).equivalent(asp::fs::Path(textureLdrUnzipped))")])
          sub("src/modules/switcheroo/Hooks.hpp", [("bool init(GJGameLevel* level, bool a, bool b);", "bool init(GJGameLevel* level, bool b);")])
          sub("src/ui/misc/LoadingPopup.cpp", [("m_title->limitLabelWidth(", "m_title->setLimitLabelWidth(")])
          sub("src/modules/scripting-ui/ui/SetupFireServerPopup.cpp", [(".child(Build<Label>::create(name, \"bigFont.fnt\").limitLabelWidth(36.f, 0.45f, 0.1f))", ".child(Build<Label>::create(name, \"bigFont.fnt\").with([](Label* l) { l->setLimitLabelWidth(36.f, 0.45f, 0.1f); }))")])

          # devtools (API de eventos de Geode v5, no existe en v6)
          sub("src/ui/menu/GlobedMenuLayer.cpp", [("#include <geode.devtools/include/API.hpp>", ""), ("devtools::isOpen()", "false")])

          # soft-link API (usa GEODE_EVENT_EXPORT, eliminado en v6): sin integracion con otros mods
          sub("include/globed/soft-link/Table.hpp", [(
              "inline geode::Result<RootApiTable*> getRootTable() GEODE_EVENT_EXPORT(&getRootTable, ());",
              "geode::Result<RootApiTable*> getRootTable();")])
          PY
          grep -rn "pathToString" globed_src/src globed_src/include || echo "sin pathToString"

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Setup Geode CLI
        uses: geode-sdk/cli/.github/actions/setup@main

      - name: Geode CLI profile
        run: |
          CLI_PROFILE="$GITHUB_WORKSPACE/cli-profile"
          mkdir -p "$CLI_PROFILE/geode/mods"
          geode profile add --name GithubActions "$CLI_PROFILE/GeometryDash.exe" win

      - name: Clone Geode SDK (${{ env.GEODE_REF }})
        run: |
          git clone --depth 1 --branch "$GEODE_REF" --recurse-submodules --shallow-submodules \
            https://github.com/geode-sdk/geode "$GITHUB_WORKSPACE/geode-sdk-clone"
          echo "GEODE_SDK=$GITHUB_WORKSPACE/geode-sdk-clone" >> "$GITHUB_ENV"
          git -C geode-sdk-clone log -1 --format='Geode %h %ad %s' --date=short
          grep -n "android:" geode-sdk-clone/CMakeLists.txt | head -2

      # Las bindings de geode-sdk/bindings (main) estan en obras para 2.209x y a veces quedan rotas entre commits
      # (el 21-oct el commit 7229495 quito miembros de EditorPauseLayer y dejo su inline sin actualizar).
      # Se fija un commit conocido que compila y se usa en el loader y en el mod.
      - name: Clonar bindings (commit fijo)
        shell: bash
        run: |
          git clone --filter=blob:none https://github.com/geode-sdk/bindings "$GITHUB_WORKSPACE/bindings-clone"
          git -C "$GITHUB_WORKSPACE/bindings-clone" checkout "$BINDINGS_REF"
          git -C "$GITHUB_WORKSPACE/bindings-clone" log -1 --format='bindings %h %ad %s' --date=short
          echo "GEODE_BINDINGS_REPO_PATH=$GITHUB_WORKSPACE/bindings-clone" >> "$GITHUB_ENV"

      # El mod se enlaza contra Geode.android64.so: se compila el loader de la misma rama.
      # (Directorio de build distinto de "build": el CMake del mod usa $GEODE_SDK/build para el SDK.)
      - name: Build Geode loader (link target)
        shell: bash
        run: |
          set -o pipefail
          NDK=/usr/local/lib/android/sdk/ndk/29.0.14206865
          [ -d "$NDK" ] || NDK="$ANDROID_NDK_LATEST_HOME"
          cd "$GEODE_SDK"
          cmake -B loader-build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DGEODE_CODEGEN_CMAKE_ARGS="-DCMAKE_C_COMPILER=clang;-DCMAKE_CXX_COMPILER=clang++;-G Ninja" \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DANDROID_PLATFORM=android-23 -DANDROID_STL=c++_shared -DANDROID_ABI=arm64-v8a \
            -DGEODE_BINDINGS_REPO_PATH="$GEODE_BINDINGS_REPO_PATH" \
            -DGEODE_GD_VERSION="$GD_VERSION" -DGEODE_COMP_GD_VERSION="$GD_COMP_VERSION" 2>&1 | tee "$GITHUB_WORKSPACE/loader.log"
          cmake --build loader-build --parallel -- -k 0 2>&1 | tee -a "$GITHUB_WORKSPACE/loader.log"
          ls -la bin/nightly/Geode.android64.so

      - name: Errores del loader (resumen)
        if: ${{ failure() }}
        shell: bash
        run: |
          {
            echo "## Errores al compilar el loader"
            echo '```'
            grep -n -B1 -A12 -E 'FAILED:|error:|CMake Error|undefined reference|ld: error|fatal error' loader.log | head -150
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Diagnostico de asp2 (CPM)
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          echo "SDK: $(git -C geode-sdk-clone log -1 --format='%h %ad %s' --date=short)"
          grep -n 'GEODE_ASP_VERSION "' geode-sdk-clone/CMakeLists.txt || true
          ls cpm-cache/asp2 || true
          ls cpm-cache/asp2/*/include/asp/fs/Path.hpp || echo "FALTA asp/fs/Path.hpp en asp2"

      - name: Build mod
        shell: bash
        run: |
          NDK=/usr/local/lib/android/sdk/ndk/29.0.14206865
          [ -d "$NDK" ] || NDK="$ANDROID_NDK_LATEST_HOME"
          cd globed_src
          set +e
          {
            cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
              -DGEODE_CODEGEN_CMAKE_ARGS="-DCMAKE_C_COMPILER=clang;-DCMAKE_CXX_COMPILER=clang++;-G Ninja" \
              -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
              -DANDROID_STL=c++_shared -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-23 \
              -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON \
              -DGEODE_DONT_INSTALL_MODS=ON -DGEODE_TARGET_PLATFORM=Android64 \
              -DGEODE_GD_VERSION="$GD_VERSION" -DGEODE_COMP_GD_VERSION="$GD_COMP_VERSION" \
              -DGEODE_BINDINGS_REPO_PATH="$GEODE_BINDINGS_REPO_PATH" \
              -DGLOBED_RELEASE=ON \
            && {
              echo "== Parcheando qunet/argon para asp 1.5.x y Geode v6 =="
              python3 - "$GITHUB_WORKSPACE/cpm-cache" <<'PY'
          import sys, re, glob
          root = sys.argv[1]
          def patch(pattern, fn):
              files = glob.glob(f"{root}/{pattern}", recursive=True)
              print(pattern, "->", files)
              for f in files:
                  t = open(f).read(); n = fn(t)
                  print("  cambiado" if n != t else "  SIN CAMBIOS", f)
                  open(f, "w").write(n)

          def qdb(t):
              for a, b in [("asp::fs::exists(qdbPath)", "asp::fs::exists(qdbPath.string())"),
                           ("asp::fs::read(qdbPath)", "asp::fs::read(qdbPath.string())"),
                           ("asp::fs::exists(folder)", "asp::fs::exists(folder.string())"),
                           ("asp::fs::createDirAll(folder)", "asp::fs::createDirAll(folder.string())"),
                           ("return asp::fs::write(qdbPath, data);",
                            "auto wr_ = asp::fs::write(qdbPath.string(), data);\n    if (!wr_) return Err(wr_.unwrapErr().toString());\n    return Ok();")]:
                  t = t.replace(a, b)
              return t
          patch("qunet-cpp/*/src/database/QunetDatabase.cpp", qdb)

          patch("qunet-cpp/*/src/socket/Socket.cpp",
                lambda t: t.replace('Saving Qunet database to {:?}", *m_qdbFolder)', 'Saving Qunet database to {:?}", m_qdbFolder->string())'))

          patch("argon/*/src/ArgonStorage.cpp",
                lambda t: t.replace("asp::fs::isFile(storagePath)", "storagePath.isFile()"))

          def web(t):
              t = t.replace('#include "external/ServerAPIEvents.hpp"', '')
              t = t.replace("gd::string", "std::string")
              t = re.sub(r'if \(Loader::get\(\)->isModLoaded\("km7dev.server_api"\)\) \{.*?\n    \}\n', '', t, count=1, flags=re.S)
              t = re.sub(r'bool isAmazonStore = false\s*GEODE_ANDROID\(.*?\);', 'bool isAmazonStore = false;', t, count=1, flags=re.S)
              t = t.replace("std::string ret = g_urlOffset.addr(isAmazonStore);", 'std::string ret = "https://www.boomlings.com/database";')
              t = t.replace('static_assert(g_urlOffset.valid, "Unsupported GD version");', '')
              return t
          patch("argon/*/src/Web.cpp", web)

          def aspath(t):
              if "is_same_v<P, std::filesystem::path>" in t: return t
              t = t.replace("#pragma once", "#pragma once\n#include <filesystem>", 1)
              t = t.replace("    PathView(const char* path) : m_path(path) {}\n",
                            "    PathView(const char* path) : m_path(path) {}\n    template <typename P> requires std::is_same_v<P, std::filesystem::path> PathView(const P& p) : m_path(p.native()) {}\n", 1)
              t = t.replace("    Path(const char* path) : m_path(path) {}\n",
                            "    Path(const char* path) : m_path(path) {}\n    template <typename P> requires std::is_same_v<P, std::filesystem::path> Path(const P& p) : m_path(p.string()) {}\n    operator std::filesystem::path() const { return std::filesystem::path(this->string()); }\n", 1)
              return t
          patch("asp2/*/include/asp/fs/Path.hpp", aspath)
          PY
            } \
            && cmake --build build --config Release --parallel -- -k 0
          } 2>&1 | tee "$GITHUB_WORKSPACE/build.log"
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            {
              echo "## Error compilando Globed"
              echo '```'
              grep -E '^/.*(error|fatal error):|CMake Error|undefined reference|ld: error' "$GITHUB_WORKSPACE/build.log" | sed 's|/home/runner/work/compiled/compiled/||' | sort -u | cut -c1-260 | head -250
              echo '```'
            } | tee -a "$GITHUB_STEP_SUMMARY"
            exit $code
          fi
          mkdir -p "$GITHUB_WORKSPACE/output"
          find ./build -name "*.geode" -exec cp {} "$GITHUB_WORKSPACE/output/" \;
          ls -la "$GITHUB_WORKSPACE/output"
          ls "$GITHUB_WORKSPACE"/output/*.geode > /dev/null

      - name: Upload build logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: globed-build-logs
          path: |
            build.log
            loader.log
          if-no-files-found: ignore

      - name: Upload .geode
        uses: actions/upload-artifact@v4
        with:
          name: globed-android64-2.2091
          path: output/*.geode
          if-no-files-found: error
          
